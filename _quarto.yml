project:
  type: book
  post-render:
    - bash ./scripts/build-glossary.sh

resources:
  - glossary.json
  - scripts/*.js
  # Printable lesson sheets.  The student copy is linked from each lesson page.
  # The _KEY copy sits beside it and is deliberately not linked: it is
  # reachable only by typing the URL.  Built by ./build.sh.
  - handouts/Unit_*/*.pdf

extensions:
  - glossary
  - headings

format:
  html:
    theme:
      - flatly
    fontsize: 1.1em
    linestretch: 1.6
    css:
      - styles/glossary-tooltips.css
      - styles/custom-callouts.css
      - styles/custom-general.css
      - styles/ai-and-you.css
    include-after-body:
      - scripts/inject-custom.html

book:
  title: "AI and You"
  author: "Andy Ross"
  favicon: images/logo.png
  image: images/logo.png
  search: true

  navbar:
    search: true

  page-footer:
    center: "Written by Mr. Ross in collaboration with Claude, an AI assistant made by Anthropic."

  sidebar:
    search: true
    logo: images/logo.png
    collapse-level: 1

  chapters:
    - file: index.md
    - file: course-map.qmd

    - part: "Unit 1: Where AI Came From"
      chapters:
        - file: chapters/Unit_1/index.qmd
        - file: chapters/Unit_1/1.1_What_Is_AI.qmd
        - file: chapters/Unit_1/1.2_Can_a_Machine_Think.qmd
        - file: chapters/Unit_1/1.3_The_First_Chatbot.qmd
        - file: chapters/Unit_1/1.4_Rules_Win_at_Games.qmd
        - file: chapters/Unit_1/1.5_Data_Changes_Everything.qmd
        - file: chapters/Unit_1/1.6_Transformers_and_ChatGPT.qmd

    - part: "Unit 2: Brains and Neural Networks"
      chapters:
        - file: chapters/Unit_2/index.qmd
        - file: chapters/Unit_2/2.1_Simple_Rules_Complex_Behavior.qmd
        - file: chapters/Unit_2/2.2_Your_Brain_Is_Made_of_Cells.qmd
        - file: chapters/Unit_2/2.3_How_Brains_Learn.qmd
        - file: chapters/Unit_2/2.4_The_Artificial_Neuron.qmd
        - file: chapters/Unit_2/2.5_Train_a_Human_Neural_Network.qmd
        - file: chapters/Unit_2/2.6_Watch_Mr_Ross_Build_an_AI.qmd
        - file: chapters/Unit_2/2.7_Train_Your_Own_AI.qmd
        - file: chapters/Unit_2/2.8_How_AI_Sees.qmd
        - file: chapters/Unit_2/2.9_How_Chatbots_Work.qmd

    - part: "Unit 3: Using AI Well"
      chapters:
        - file: chapters/Unit_3/index.qmd
        - file: chapters/Unit_3/3.1_Asking_Good_Questions.qmd
        - file: chapters/Unit_3/3.2_Keep_Talking.qmd
        - file: chapters/Unit_3/3.3_Writing_with_AI.qmd
        - file: chapters/Unit_3/3.4_Research_and_Checking.qmd
        - file: chapters/Unit_3/3.5_AI_and_Your_Language.qmd
        - file: chapters/Unit_3/3.6_AI_and_Math.qmd
        - file: chapters/Unit_3/3.7_Making_Pictures_with_AI.qmd
        - file: chapters/Unit_3/3.8_Project_Solve_a_Real_Problem.qmd
        - file: chapters/Unit_3/3.9_Project_Feedback_and_Share.qmd

    - part: "Unit 4: When AI Gets It Wrong"
      chapters:
        - file: chapters/Unit_4/index.qmd
        - file: chapters/Unit_4/4.1_AI_Makes_Things_Up.qmd
        - file: chapters/Unit_4/4.2_Where_Bias_Comes_From.qmd
        - file: chapters/Unit_4/4.3_Real_or_Fake.qmd
        - file: chapters/Unit_4/4.4_Why_AI_Cheat_Detectors_Fail.qmd

    - part: "Unit 5: AI in the Real World"
      chapters:
        - file: chapters/Unit_5/index.qmd

    - part: "Unit 6: AI and Our Future"
      chapters:
        - file: chapters/Unit_6/index.qmd

    - part: "Explore More"
      chapters:
        - file: chapters/Explore/index.qmd
        - file: chapters/Explore/explore-unit-1.qmd
        - file: chapters/Explore/explore-unit-2.qmd
        - file: chapters/Explore/explore-unit-3.qmd
        - file: chapters/Explore/explore-unit-4.qmd

    - file: glossary.qmd
