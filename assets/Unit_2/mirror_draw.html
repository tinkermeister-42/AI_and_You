```{=html}
<!-- mirror_draw.html: Lesson 2.3. Trace a star with a "mirror" pen: the pen
     moves up when your hand moves down. Each try records time and mistakes,
     so students can graph how practice changes their brain. On a touch screen
     a pad under the star takes the finger, so the finger never hides the star
     (like a real mirror test, where your hand is hidden). -->
<div class="md" id="md">
  <div class="md-bar">
    <label>Pen: <select class="md-mode">
      <option value="ud">mirror: up and down flipped</option>
      <option value="lr">mirror: left and right flipped</option>
      <option value="none">normal (no mirror)</option>
    </select></label>
    <button type="button" class="md-btn md-plain md-reset">↺ Clear my tries</button>
  </div>
  <div class="md-msg">Put the orange pen dot on the green circle. Then press and hold, and trace the star all the way around.</div>
  <canvas class="md-canvas" width="480" height="480" aria-label="Mirror drawing area"></canvas>
  <div class="md-pad" aria-label="Touch pad: move your finger here and watch the star"><span>Trace here with your finger.<br>Watch the star, not your finger.</span></div>
  <table class="md-table"><thead><tr><th>Try</th><th>Pen</th><th>Time (seconds)</th><th>Mistakes</th></tr></thead><tbody></tbody></table>
</div>

<style>
.md { border: 1px solid #d9e1e8; border-radius: 10px; padding: 0.8rem; margin: 0.75rem 0 1.25rem; background: #fbfcfd; }
.md-bar { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; margin-bottom: 0.5rem; }
.md-btn { border: 1px solid #2c3e50; background: #2c3e50; color: #fff; border-radius: 6px; padding: 0.3rem 0.8rem; font-weight: 600; cursor: pointer; }
.md-btn.md-plain { background: #fff; color: #2c3e50; }
.md-msg { min-height: 4.6em; line-height: 1.5; font-weight: 600; margin-bottom: 0.4rem; }  /* fixed height: the star and pad never jump while you draw */
.md-canvas { display: block; width: 100%; max-width: 480px; height: auto; margin: 0 auto; border: 2px solid #2c3e50; border-radius: 8px; background: #fff; cursor: none; touch-action: none; }
.md-pad { display: none; position: relative; width: 100%; max-width: 480px; aspect-ratio: 1 / 1; margin: 0.5rem auto 0; background: #f2f4f6; border: 2px dashed #95a5a6; border-radius: 8px; touch-action: none; user-select: none; -webkit-user-select: none; }
.md-pad span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: #7f8c8d; font-weight: 600; pointer-events: none; }
.md.pad-on .md-pad { display: block; }
.md-table { margin: 0.6rem auto 0; border-collapse: collapse; }
.md-table th, .md-table td { border: 1px solid #d9e1e8; padding: 0.2rem 0.7rem; text-align: center; }
</style>

<script>
(() => {
  const root = document.getElementById("md");
  if (!root) return;
  const cv = root.querySelector(".md-canvas");
  const cx = cv.getContext("2d");
  const msg = root.querySelector(".md-msg");
  const mode = root.querySelector(".md-mode");
  const tbody = root.querySelector(".md-table tbody");
  const W = cv.width, H = cv.height, BAND = 30, START_R = 16;

  // a 5-point star, starting at the top point
  const P = [];
  for (let k = 0; k < 10; k++) {
    const r = k % 2 ? 78 : 195, a = -Math.PI / 2 + (k * Math.PI) / 5;
    P.push([W / 2 + r * Math.cos(a), H / 2 + 12 + r * Math.sin(a)]);
  }
  const SEG = P.map((p, i) => [p, P[(i + 1) % 10]]);

  let pen = null, drawing = false, started = false, inside = true;
  let t0 = 0, mistakes = 0, trail = [], visited = new Set(), tries = [];

  function segDist([a, b], [x, y]) {
    const dx = b[0] - a[0], dy = b[1] - a[1];
    let t = ((x - a[0]) * dx + (y - a[1]) * dy) / (dx * dx + dy * dy);
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(x - (a[0] + t * dx), y - (a[1] + t * dy));
  }
  function nearest(p) {
    let best = 0, d = Infinity;
    SEG.forEach((s, i) => { const e = segDist(s, p); if (e < d) { d = e; best = i; } });
    return { i: best, d };
  }
  const pad = root.querySelector(".md-pad");
  let down = false, justDone = false;  // justDone: don't restart until the finger lifts or leaves the circle
  function usePad(on) {
    root.classList.toggle("pad-on", on);
    msg.textContent = on
      ? "Touch the gray pad. Slide until the orange dot is on the green circle, then trace the star."
      : "Put the orange pen dot on the green circle. Then press and hold, and trace the star all the way around.";
  }
  function map(e, el) {
    const r = el.getBoundingClientRect();
    let x = ((e.clientX - r.left) / r.width) * W, y = ((e.clientY - r.top) / r.height) * H;
    if (mode.value === "ud") y = H - y;
    if (mode.value === "lr") x = W - x;
    return [x, y];
  }
  const atStart = (p, f = 1) => Math.hypot(p[0] - P[0][0], p[1] - P[0][1]) < START_R * f;
  function begin(p) {
    drawing = true; started = false; mistakes = 0; inside = true; visited = new Set(); trail = [p];
    msg.textContent = "Go! Trace the star. Stay inside the blue path.";
  }
  function draw() {
    cx.clearRect(0, 0, W, H);
    cx.lineJoin = "round"; cx.lineCap = "round";
    cx.strokeStyle = "#d6eaf8"; cx.lineWidth = BAND;
    cx.beginPath(); P.forEach((p, i) => (i ? cx.lineTo(...p) : cx.moveTo(...p))); cx.closePath(); cx.stroke();
    cx.strokeStyle = "#85c1e9"; cx.lineWidth = 1.5;
    cx.beginPath(); P.forEach((p, i) => (i ? cx.lineTo(...p) : cx.moveTo(...p))); cx.closePath(); cx.stroke();
    cx.fillStyle = "#1e8449"; cx.beginPath(); cx.arc(P[0][0], P[0][1], START_R, 0, 2 * Math.PI); cx.fill();
    cx.strokeStyle = "#2c3e50"; cx.lineWidth = 3; cx.beginPath();
    trail.forEach((p, i) => (i && !p.lift ? cx.lineTo(p[0], p[1]) : cx.moveTo(p[0], p[1]))); cx.stroke();
    if (pen) { cx.fillStyle = "#d35400"; cx.beginPath(); cx.arc(pen[0], pen[1], 7, 0, 2 * Math.PI); cx.fill(); }
  }
  function finish() {
    drawing = false; started = false; justDone = true;
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    tries.push([mode.options[mode.selectedIndex].text.replace("mirror: ", ""), secs, mistakes]);
    tbody.innerHTML = tries.map((t, i) => `<tr><td>${i + 1}</td><td>${t[0]}</td><td>${t[1]}</td><td>${t[2]}</td></tr>`).join("");
    msg.textContent = `Done! ${secs} seconds, ${mistakes} mistakes. Go back to the green circle to try again.`;
  }
  function move(e, el) {
    pen = map(e, el);
    if (justDone && !atStart(pen, 1.4)) justDone = false;
    if (down && !drawing && !justDone && atStart(pen, 1.4)) begin(pen);
    if (drawing) {
      const n = nearest(pen);
      const now = n.d <= BAND / 2;
      if (!now && inside) { mistakes++; msg.textContent = `Mistakes: ${mistakes}. Get back on the path!`; }
      inside = now;
      if (now) visited.add(n.i);
      trail.push(pen);
      if (!started && !atStart(pen)) { started = true; t0 = performance.now(); }
      if (started && atStart(pen) && visited.size === 10) finish();
    }
    draw();
  }
  function press(e, el) {
    if (el === cv && e.pointerType === "touch") {
      // a finger on the star hides it: use the pad instead
      usePad(true);
      msg.textContent = "Use the gray pad under the star, so your finger doesn't hide it.";
      return;
    }
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch (_) { /* some browsers refuse; drawing still works */ }
    down = true; justDone = false;
    pen = map(e, el);
    if (atStart(pen, 1.4)) begin(pen);
    else if (!drawing) msg.textContent = el === pad
      ? "Slide your finger until the orange dot is on the green circle."
      : "Start on the green circle. Move the orange dot there first.";
    draw();
  }
  function release(el) {
    down = false;
    if (drawing) {
      if (started) msg.textContent = "You let go! Go back to the green circle and start again.";
      drawing = false; started = false;
    }
    if (el === pad) { pen = null; draw(); }
  }
  [cv, pad].forEach((el) => {
    el.addEventListener("pointermove", (e) => move(e, el));
    el.addEventListener("pointerdown", (e) => press(e, el));
    el.addEventListener("pointerup", () => release(el));
    el.addEventListener("pointercancel", () => release(el));
  });
  cv.addEventListener("pointerleave", () => { if (!down) { pen = null; draw(); } });
  mode.addEventListener("change", () => { drawing = false; trail = []; draw(); msg.textContent = "New pen! Start on the green circle."; });
  root.querySelector(".md-reset").addEventListener("click", () => { tries = []; tbody.innerHTML = ""; trail = []; draw(); });
  usePad(window.matchMedia ? matchMedia("(any-pointer: coarse)").matches : false);
  draw();
})();
</script>
