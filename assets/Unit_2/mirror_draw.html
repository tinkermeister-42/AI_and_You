```{=html}
<!-- mirror_draw.html: Lesson 2.3. Drag a green dot around a star with a
     "mirror" pen: the pen moves up when your hand moves down. Letting go is
     fine: the dot stays put, and the clock only runs while you hold it. Each
     try records time and mistakes, so students can graph how practice changes
     their brain. -->
<div class="md" id="md">
  <div class="md-bar">
    <label>Pen: <select class="md-mode">
      <option value="ud">mirror: up and down flipped</option>
      <option value="lr">mirror: left and right flipped</option>
      <option value="none">normal (no mirror)</option>
    </select></label>
    <button type="button" class="md-btn md-plain md-reset">↺ Clear my tries</button>
  </div>
  <div class="md-msg">Press and slide until the orange pen touches the green dot. Then drag the dot around the star.</div>
  <canvas class="md-canvas" width="480" height="480" aria-label="Mirror drawing area"></canvas>
  <table class="md-table"><thead><tr><th>Try</th><th>Pen</th><th>Time (seconds)</th><th>Mistakes</th></tr></thead><tbody></tbody></table>
</div>

<style>
.md { border: 1px solid #d9e1e8; border-radius: 10px; padding: 0.8rem; margin: 0.75rem 0 1.25rem; background: #fbfcfd; }
.md-bar { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; margin-bottom: 0.5rem; }
.md-btn { border: 1px solid #2c3e50; background: #2c3e50; color: #fff; border-radius: 6px; padding: 0.3rem 0.8rem; font-weight: 600; cursor: pointer; }
.md-btn.md-plain { background: #fff; color: #2c3e50; }
.md-msg { min-height: 4.6em; line-height: 1.5; font-weight: 600; margin-bottom: 0.4rem; }  /* fixed height: the star never jumps while you draw */
.md-canvas { display: block; width: 100%; max-width: 480px; height: auto; margin: 0 auto; border: 2px solid #2c3e50; border-radius: 8px; background: #fff; cursor: none; touch-action: none; }
.md-table { margin: 0.6rem auto 0; border-collapse: collapse; }
.md-table th, .md-table td { border: 1px solid #d9e1e8; padding: 0.2rem 0.7rem; text-align: center; }
</style>

<script>
(() => {
  const root = document.getElementById("md");
  if (!root) return;
  const cv = root.querySelector(".md-canvas"), cx = cv.getContext("2d");
  const msg = root.querySelector(".md-msg"), mode = root.querySelector(".md-mode");
  const tbody = root.querySelector(".md-table tbody");
  const W = cv.width, H = cv.height, BAND = 46, DOT_R = 15, GRAB = 26, HOME_R = 20;

  // a 5-point star, starting at the top point
  const P = [];
  for (let k = 0; k < 10; k++) {
    const r = k % 2 ? 78 : 195, ang = -Math.PI / 2 + (k * Math.PI) / 5;
    P.push([W / 2 + r * Math.cos(ang), H / 2 + 12 + r * Math.sin(ang)]);
  }
  const SEG = P.map((q, i) => [q, P[(i + 1) % 10]]);
  const dist = (u, v) => Math.hypot(u[0] - v[0], u[1] - v[1]);

  // dot: the green dot you drag around the star. It stays put when you let go.
  let pen = null, dot = P[0].slice(), down = false, holding = false, needLift = false;  // needLift: after a finish, wait for a new press
  let started = false, done = false, inside = true, mistakes = 0;
  let clock = 0, heldSince = 0, trail = [], visited = new Set(), tries = [];

  function segDist([u, v], [x, y]) {
    const dx = v[0] - u[0], dy = v[1] - u[1];
    let t = ((x - u[0]) * dx + (y - u[1]) * dy) / (dx * dx + dy * dy);
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(x - (u[0] + t * dx), y - (u[1] + t * dy));
  }
  function nearest(q) {
    let best = 0, d = Infinity;
    SEG.forEach((sg, i) => { const e = segDist(sg, q); if (e < d) { d = e; best = i; } });
    return { i: best, d };
  }
  function map(e, el) {
    const r = el.getBoundingClientRect();
    let x = ((e.clientX - r.left) / r.width) * W, y = ((e.clientY - r.top) / r.height) * H;
    if (mode.value === "ud") y = H - y;
    if (mode.value === "lr") x = W - x;
    return [x, y];
  }
  const seconds = () => (clock + (holding && started ? performance.now() - heldSince : 0)) / 1000;

  function draw() {
    cx.clearRect(0, 0, W, H);
    cx.lineJoin = "round"; cx.lineCap = "round";
    cx.strokeStyle = "#d6eaf8"; cx.lineWidth = BAND;
    cx.beginPath(); P.forEach((q, i) => (i ? cx.lineTo(...q) : cx.moveTo(...q))); cx.closePath(); cx.stroke();
    cx.strokeStyle = "#85c1e9"; cx.lineWidth = 1.5;
    cx.beginPath(); P.forEach((q, i) => (i ? cx.lineTo(...q) : cx.moveTo(...q))); cx.closePath(); cx.stroke();
    // the start and finish: a green ring
    cx.strokeStyle = "#1e8449"; cx.lineWidth = 3;
    cx.beginPath(); cx.arc(P[0][0], P[0][1], HOME_R + 4, 0, 2 * Math.PI); cx.stroke();
    cx.fillStyle = "#1e8449"; cx.font = "bold 13px system-ui, sans-serif"; cx.textAlign = "center";
    cx.fillText("start and finish", P[0][0], P[0][1] - HOME_R - 10);
    // the trail
    cx.strokeStyle = "#2c3e50"; cx.lineWidth = 3; cx.beginPath();
    trail.forEach((q, i) => (i && !q.lift ? cx.lineTo(q[0], q[1]) : cx.moveTo(q[0], q[1]))); cx.stroke();
    // the green dot
    cx.fillStyle = "#1e8449"; cx.beginPath(); cx.arc(dot[0], dot[1], DOT_R, 0, 2 * Math.PI); cx.fill();
    if (holding) { cx.strokeStyle = "#145a32"; cx.lineWidth = 3; cx.beginPath(); cx.arc(dot[0], dot[1], DOT_R + 4, 0, 2 * Math.PI); cx.stroke(); }
    // the pen: where your hand is (mirrored)
    if (pen && !holding) { cx.fillStyle = "#d35400"; cx.beginPath(); cx.arc(pen[0], pen[1], 7, 0, 2 * Math.PI); cx.fill(); }
  }

  function newTry() {
    dot = P[0].slice(); trail = []; visited = new Set(); mistakes = 0; inside = true;
    started = false; done = false; clock = 0;
  }
  function grab() {
    if (done) newTry();
    holding = true; heldSince = performance.now();
    trail.push(Object.assign(dot.slice(), { lift: true }));
    msg.textContent = started ? "Keep going! Stay inside the blue path." : "Drag the green dot all the way around the star.";
  }
  function letGo(text) {
    if (holding && started) clock += performance.now() - heldSince;
    holding = false;
    if (!done && started && text) msg.textContent = text;
  }
  function finish() {
    letGo(); done = true; needLift = true;
    const secs = (clock / 1000).toFixed(1);
    tries.push([mode.options[mode.selectedIndex].text.replace("mirror: ", ""), secs, mistakes]);
    tbody.innerHTML = tries.map((t, i) => `<tr><td>${i + 1}</td><td>${t[0]}</td><td>${t[1]}</td><td>${t[2]}</td></tr>`).join("");
    msg.textContent = `Done! ${secs} seconds, ${mistakes} mistakes. Grab the green dot to try again.`;
  }

  function move(e, el) {
    pen = map(e, el);
    if (down && !holding && !needLift && dist(pen, dot) < GRAB) grab();
    if (holding) {
      dot = pen.slice();
      const n = nearest(dot), now = n.d <= BAND / 2;
      if (!now && inside) { mistakes++; msg.textContent = `Mistakes: ${mistakes}. Get back on the path!`; }
      else if (now && !inside) msg.textContent = "Good. Keep going!";
      inside = now;
      if (now) visited.add(n.i);
      trail.push(dot.slice());
      const home = dist(dot, P[0]) < HOME_R;
      if (!started && !home) { started = true; heldSince = performance.now(); }
      if (started && home && visited.size === 10) finish();
    }
    draw();
  }
  function press(e, el) {
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch (_) { /* drawing still works */ }
    down = true; needLift = false;
    pen = map(e, el);
    if (dist(pen, dot) < GRAB) grab();
    else msg.textContent = "Slide until the orange pen touches the green dot.";
    draw();
  }
  function release(e) {
    down = false;
    letGo("You let go. That's OK! Grab the green dot again and keep going. The clock waits for you.");
    if (e.pointerType !== "mouse") pen = null;
    draw();
  }
  cv.addEventListener("pointermove", (e) => move(e, cv));
  cv.addEventListener("pointerdown", (e) => press(e, cv));
  cv.addEventListener("pointerup", release);
  cv.addEventListener("pointercancel", release);
  cv.addEventListener("pointerleave", () => { if (!down) { pen = null; draw(); } });
  mode.addEventListener("change", () => { holding = false; newTry(); draw(); msg.textContent = "New pen! Grab the green dot to start."; });
  root.querySelector(".md-reset").addEventListener("click", () => { tries = []; tbody.innerHTML = ""; holding = false; newTry(); draw(); });
  draw();
})();
</script>
