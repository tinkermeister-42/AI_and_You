<!-- neuron_trainer.html: Lesson 2.5. The class's Fighting-or-Psychic neuron,
     step by step, to check the class's math. Same deck, same order, same
     starting weights and fix rule as the printed cards. The plot shows the
     neuron's decision line. Data: Mr. Ross's Pokédex CSV (stars = stat / 30,
     rounded, from 1 to 5). -->
<div class="nt" id="nt">
  <div class="nt-top">
    <div class="nt-left">
      <div class="nt-weights">
        <div><span>Attack weight</span><b class="nt-wa">-1</b></div>
        <div><span>Special weight</span><b class="nt-ws">1</b></div>
        <div><span>Bias</span><b class="nt-b">0</b></div>
      </div>
      <div class="nt-card" aria-live="polite"></div>
      <div class="nt-bar">
        <button type="button" class="nt-btn nt-step">▶ Next card</button>
        <button type="button" class="nt-btn nt-plain nt-pass">⏩ Finish this pass</button>
        <button type="button" class="nt-btn nt-plain nt-reset">↺ Start over</button>
      </div>
      <div class="nt-log"></div>
    </div>
    <div class="nt-right">
      <canvas class="nt-plot" width="420" height="420" aria-label="Plot of the cards and the neuron's decision line"></canvas>
      <div class="nt-key"><span class="f">■</span> Fighting card &nbsp; <span class="p">●</span> Psychic card &nbsp; <span class="l">—</span> the neuron's line</div>
    </div>
  </div>
  <div class="nt-bottom">
    <button type="button" class="nt-btn nt-plain nt-test">🧪 Test the 6 new cards</button>
    <button type="button" class="nt-btn nt-plain nt-all">📊 Test on all 140 Fighting and Psychic Pokémon</button>
    <div class="nt-res"></div>
  </div>
</div>

<style>
.nt { border: 1px solid #d9e1e8; border-radius: 10px; padding: 0.8rem; margin: 0.75rem 0 1.25rem; background: #fbfcfd; }
.nt-top { display: flex; flex-wrap: wrap; gap: 1rem; }
.nt-left { flex: 1 1 280px; display: flex; flex-direction: column; gap: 0.5rem; }
.nt-right { flex: 0 1 360px; }
.nt-weights { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; }
.nt-weights div { background: #fff; border: 2px solid #d35400; border-radius: 8px; text-align: center; padding: 0.3rem; }
.nt-weights span { display: block; font-size: 0.8rem; color: #555; }
.nt-weights b { font-size: 1.5rem; color: #d35400; }
.nt-card { min-height: 7.5em; background: #fff; border: 1px solid #d9e1e8; border-radius: 8px; padding: 0.5rem 0.7rem; line-height: 1.55; }
.nt-card .ok { color: #1e8449; font-weight: bold; }
.nt-card .no { color: #c0392b; font-weight: bold; }
.nt-bar, .nt-bottom { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
.nt-bottom { margin-top: 0.7rem; border-top: 1px solid #e3e8ed; padding-top: 0.6rem; }
.nt-btn { border: 1px solid #2c3e50; background: #2c3e50; color: #fff; border-radius: 6px; padding: 0.3rem 0.8rem; font-weight: 600; cursor: pointer; }
.nt-btn.nt-plain { background: #fff; color: #2c3e50; }
.nt-log { font-size: 0.9rem; color: #333; }
.nt-plot { width: 100%; height: auto; background: #fff; border: 1px solid #e3e8ed; border-radius: 8px; display: block; }
.nt-key { font-size: 0.85rem; margin-top: 0.3rem; }
.nt-key .f { color: #d35400; } .nt-key .p { color: #7d3c98; } .nt-key .l { color: #2c3e50; font-weight: bold; }
.nt-res { flex-basis: 100%; line-height: 1.6; }
.nt-res table { border-collapse: collapse; margin-top: 0.3rem; }
.nt-res td, .nt-res th { border: 1px solid #d9e1e8; padding: 0.15rem 0.5rem; text-align: center; }
</style>

<script>
(() => {
  const root = document.getElementById("nt");
  if (!root) return;
  // name, attack stars, special attack stars, F or P (second type in note)
  const DECK = [
    ["Machop",3,1,"F"],["Abra",1,4,"P"],["Machamp",4,2,"F"],["Espeon",2,4,"P"],["Hitmonlee",4,1,"F"],
    ["Kirlia",1,2,"P"],["Conkeldurr",5,2,"F"],["Alakazam",2,5,"P"],["Makuhita",2,1,"F"],["Mr. Mime",2,3,"P"]];
  const TEST = [
    ["Primeape",4,2,"F",""],["Mewtwo",4,5,"P",""],["Hypno",2,2,"P",""],
    ["Gallade",4,2,"P","Psychic and Fighting"],["Lucario",4,4,"F","Fighting and Steel"],["Medicham",2,2,"F","Fighting and Psychic"]];
  const ALL = [["mankey",3,1,"F"],["primeape",4,2,"F"],["abra",1,4,"P"],["kadabra",1,4,"P"],["alakazam",2,5,"P"],["machop",3,1,"F"],["machoke",3,2,"F"],["machamp",4,2,"F"],["drowzee",2,1,"P"],["hypno",2,2,"P"],["hitmonlee",4,1,"F"],["hitmonchan",4,1,"F"],["mr-mime",2,3,"P"],["mewtwo",4,5,"P"],["mew",3,3,"P"],["natu",2,2,"P"],["xatu",3,3,"P"],["espeon",2,4,"P"],["unown",2,2,"P"],["wobbuffet",1,1,"P"],["tyrogue",1,1,"F"],["hitmontop",3,1,"F"],["lugia",3,3,"P"],["celebi",3,3,"P"],["ralts",1,2,"P"],["kirlia",1,2,"P"],["gardevoir",2,4,"P"],["makuhita",2,1,"F"],["hariyama",4,1,"F"],["meditite",1,1,"F"],["medicham",2,2,"F"],["spoink",1,2,"P"],["grumpig",2,3,"P"],["chimecho",2,3,"P"],["wynaut",1,1,"P"],["deoxys-normal",5,5,"P"],["chingling",1,2,"P"],["mime-jr",1,2,"P"],["riolu",2,1,"F"],["lucario",4,4,"F"],["gallade",4,2,"P"],["uxie",3,3,"P"],["mesprit",4,4,"P"],["azelf",4,4,"P"],["cresselia",2,3,"P"],["victini",3,3,"P"],["munna",1,2,"P"],["musharna",2,4,"P"],["woobat",2,2,"P"],["swoobat",2,3,"P"],["timburr",3,1,"F"],["gurdurr",4,1,"F"],["conkeldurr",5,2,"F"],["throh",3,1,"F"],["sawk",4,1,"F"],["sigilyph",2,3,"P"],["gothita",1,2,"P"],["gothorita",2,3,"P"],["gothitelle",2,3,"P"],["solosis",1,4,"P"],["duosion",1,4,"P"],["reuniclus",2,4,"P"],["elgyem",2,3,"P"],["beheeyem",3,4,"P"],["mienfoo",3,2,"F"],["mienshao",4,3,"F"],["pancham",3,2,"F"],["pangoro",4,2,"F"],["espurr",2,2,"P"],["meowstic-male",2,3,"P"],["hawlucha",3,2,"F"],["hoopa",4,5,"P"],["crabrawler",3,1,"F"],["crabominable",4,2,"F"],["passimian",4,1,"F"],["tapu-lele",3,4,"P"],["cosmog",1,1,"P"],["cosmoem",1,1,"P"],["solgaleo",5,4,"P"],["lunala",4,5,"P"],["necrozma",4,4,"P"],["marshadow",4,3,"F"],["clobbopus",2,2,"F"],["grapploct",4,2,"F"],["hatenna",1,2,"P"],["hattrem",1,3,"P"],["hatterene",3,5,"P"],["sirfetchd",5,2,"F"],["falinks",3,2,"F"],["indeedee-male",2,4,"P"],["zamazenta",4,3,"F"],["kubfu",3,2,"F"],["urshifu-single-strike",4,2,"F"],["calyrex",3,3,"P"],["sneasler",4,1,"F"],["flittle",1,2,"P"],["espathra",2,3,"P"],["annihilape",4,2,"F"],["iron-hands",5,2,"F"],["koraidon",5,3,"F"],["deoxys-attack",5,5,"P"],["deoxys-defense",2,2,"P"],["deoxys-speed",3,3,"P"],["meowstic-female",2,3,"P"],["alakazam-mega",2,5,"P"],["mewtwo-mega-x",5,5,"P"],["mewtwo-mega-y",5,5,"P"],["gardevoir-mega",3,5,"P"],["medicham-mega",3,3,"F"],["lucario-mega",5,5,"F"],["gallade-mega",5,2,"P"],["hoopa-unbound",5,5,"P"],["oricorio-pau",2,3,"P"],["necrozma-dusk",5,4,"P"],["necrozma-dawn",4,5,"P"],["necrozma-ultra",5,5,"P"],["ponyta-galar",3,2,"P"],["rapidash-galar",3,3,"P"],["slowpoke-galar",2,1,"P"],["farfetchd-galar",3,2,"F"],["articuno-galar",3,4,"P"],["zapdos-galar",4,3,"F"],["indeedee-female",2,3,"P"],["zamazenta-crowned",4,3,"F"],["urshifu-rapid-strike",4,2,"F"],["calyrex-ice",5,3,"P"],["calyrex-shadow",3,5,"P"],["machamp-gmax",4,2,"F"],["hatterene-gmax",3,5,"P"],["urshifu-single-strike-gmax",4,2,"F"],["urshifu-rapid-strike-gmax",4,2,"F"],["sneasel-hisui",3,1,"F"],["braviary-hisui",3,4,"P"],["tauros-paldea-combat-breed",4,1,"F"],["tauros-paldea-blaze-breed",4,1,"F"],["tauros-paldea-aqua-breed",4,1,"F"],["koraidon-limited-build",5,3,"F"],["koraidon-sprinting-build",5,3,"F"],["koraidon-swimming-build",5,3,"F"],["koraidon-gliding-build",5,3,"F"]];
  const START = [-1, 1, 0];
  let w, i, pass, mistakes, history;
  const NAME = { F: "FIGHTING", P: "PSYCHIC" };

  const card = root.querySelector(".nt-card"), log = root.querySelector(".nt-log"), res = root.querySelector(".nt-res");
  const cv = root.querySelector(".nt-plot"), cx = cv.getContext("2d");
  const total = (a, s) => a * w[0] + s * w[1] + w[2];
  const says = (a, s) => (total(a, s) > 0 ? "F" : "P");

  function reset() { w = START.slice(); i = 0; pass = 1; mistakes = 0; history = []; card.innerHTML = "Press <b>Next card</b> to start pass 1."; log.textContent = ""; res.innerHTML = ""; draw(); show(); }
  function show() {
    root.querySelector(".nt-wa").textContent = w[0];
    root.querySelector(".nt-ws").textContent = w[1];
    root.querySelector(".nt-b").textContent = w[2];
  }
  function step() {
    if (pass > 1 && i === 0 && history.length && history[history.length - 1] === 0) {
      card.innerHTML = "The last pass had <b>0 mistakes</b>. The neuron has learned! Now test it on new cards."; return false;
    }
    const [n, a, s, t] = DECK[i];
    const tot = total(a, s), g = says(a, s), ok = g === t;
    const fmt = (v) => (v < 0 ? "(" + v + ")" : v);
    let html = `<b>Pass ${pass}, card ${i + 1}: ${n}</b><br>Attack ${a}, Special ${s}<br>` +
      `Total = ${a} × ${fmt(w[0])} + ${s} × ${fmt(w[1])} + ${fmt(w[2])} = <b>${tot}</b>` +
      ` → says <b>${NAME[g]}</b>. Really: ${NAME[t]}. `;
    if (ok) html += '<span class="ok">Right! No change.</span>';
    else {
      const y = t === "F" ? 1 : -1;
      w = [w[0] + y * a, w[1] + y * s, w[2] + y];
      mistakes++;
      html += `<span class="no">Wrong! ${y > 0 ? "ADD" : "SUBTRACT"}:</span> new weights ${w[0]}, ${w[1]}, bias ${w[2]}.`;
    }
    card.innerHTML = html;
    i++;
    if (i === DECK.length) {
      history.push(mistakes);
      log.textContent = history.map((m, k) => `Pass ${k + 1}: ${m} mistake${m === 1 ? "" : "s"}`).join(" · ");
      i = 0; pass++; mistakes = 0;
    }
    show(); draw();
    return true;
  }
  function draw() {
    const W = cv.width, H = cv.height, pad = 46;
    const X = (a) => pad + ((a - 0.5) / 5) * (W - pad - 14), Y = (s) => H - pad - ((s - 0.5) / 5) * (H - pad - 14);
    cx.clearRect(0, 0, W, H);
    // shade the two sides
    const img = cx.createImageData(W, H);
    for (let py = 0; py < H; py++) for (let px = 0; px < W; px++) {
      const a = 0.5 + ((px - pad) / (W - pad - 14)) * 5, s = 0.5 + ((H - pad - py) / (H - pad - 14)) * 5;
      if (a < 0.5 || a > 5.5 || s < 0.5 || s > 5.5) continue;
      const f = total(a, s) > 0, k = 4 * (py * W + px);
      img.data[k] = f ? 252 : 241; img.data[k + 1] = f ? 228 : 228; img.data[k + 2] = f ? 211 : 246; img.data[k + 3] = 255;
    }
    cx.putImageData(img, 0, 0);
    cx.strokeStyle = "#d9e1e8"; cx.lineWidth = 1;
    for (let v = 1; v <= 5; v++) {
      cx.beginPath(); cx.moveTo(X(v), Y(0.5)); cx.lineTo(X(v), Y(5.5)); cx.stroke();
      cx.beginPath(); cx.moveTo(X(0.5), Y(v)); cx.lineTo(X(5.5), Y(v)); cx.stroke();
    }
    cx.fillStyle = "#2c3e50"; cx.font = "14px sans-serif"; cx.textAlign = "center";
    for (let v = 1; v <= 5; v++) { cx.fillText(v, X(v), H - pad + 18); cx.fillText(v, pad - 16, Y(v) + 5); }
    cx.fillText("Attack stars", (X(0.5) + X(5.5)) / 2, H - 8);
    cx.save(); cx.translate(12, (Y(0.5) + Y(5.5)) / 2); cx.rotate(-Math.PI / 2); cx.fillText("Special Attack stars", 0, 0); cx.restore();
    cx.font = "bold 13px sans-serif";
    cx.fillStyle = "#b9550b"; cx.fillText("says FIGHTING", X(4.6), Y(0.75));
    cx.fillStyle = "#6c3483"; cx.fillText("says PSYCHIC", X(1.4), Y(5.3));
    // the line where total = 0
    if (w[1] !== 0 || w[0] !== 0) {
      cx.strokeStyle = "#2c3e50"; cx.lineWidth = 3; cx.beginPath();
      if (w[1] !== 0) { const s0 = -(w[0] * 0.5 + w[2]) / w[1], s1 = -(w[0] * 5.5 + w[2]) / w[1]; cx.moveTo(X(0.5), Y(s0)); cx.lineTo(X(5.5), Y(s1)); }
      else { const a0 = -w[2] / w[0]; cx.moveTo(X(a0), Y(0.5)); cx.lineTo(X(a0), Y(5.5)); }
      cx.stroke();
    }
    // cards
    DECK.forEach(([n, a, s, t], k) => {
      const x = X(a), y = Y(s);
      cx.fillStyle = t === "F" ? "#d35400" : "#7d3c98";
      if (t === "F") cx.fillRect(x - 7, y - 7, 14, 14); else { cx.beginPath(); cx.arc(x, y, 8, 0, 2 * Math.PI); cx.fill(); }
      cx.fillStyle = "#2c3e50"; cx.font = "11px sans-serif"; cx.textAlign = "left"; cx.fillText(n, x + 10, y - 6); cx.textAlign = "center";
    });
  }
  root.querySelector(".nt-step").addEventListener("click", step);
  root.querySelector(".nt-pass").addEventListener("click", () => { const p = pass; while (pass === p && step()) {} });
  root.querySelector(".nt-reset").addEventListener("click", reset);
  root.querySelector(".nt-test").addEventListener("click", () => {
    res.innerHTML = "<b>Test cards</b> (no fixing on a test!)<table><tr><th>Card</th><th>Attack</th><th>Special</th><th>Total</th><th>Says</th><th>Really</th></tr>" +
      TEST.map(([n, a, s, t, note]) => `<tr><td>${n}</td><td>${a}</td><td>${s}</td><td>${total(a, s)}</td><td>${NAME[says(a, s)]}</td><td>${note || NAME[t]}</td></tr>`).join("") + "</table>";
  });
  root.querySelector(".nt-all").addEventListener("click", () => {
    const right = ALL.filter(([n, a, s, t]) => says(a, s) === t).length;
    const most = Math.max(ALL.filter((r) => r[3] === "F").length, ALL.filter((r) => r[3] === "P").length);
    res.innerHTML = `With these weights, the neuron gets <b>${right} of ${ALL.length}</b> right (${Math.round((100 * right) / ALL.length)}%).<br>` +
      `Always guessing the most common type would get ${most} of ${ALL.length} (${Math.round((100 * most) / ALL.length)}%).`;
  });
  reset();
})();
</script>
