```{=html}
<!-- simple_rules.html: Lesson 2.1. Two kinds of simple-rule worlds.
     One row: any of the 256 rules; click the rule card to make your own.
     Game of Life: click cells, then press Run. -->
<div class="sr" id="sr">
  <div class="sr-tabs">
    <button type="button" class="sr-tab" data-tab="row" aria-pressed="true">One row of cells</button>
    <button type="button" class="sr-tab" data-tab="life" aria-pressed="false">The Game of Life</button>
  </div>

  <div class="sr-pane" data-pane="row">
    <div class="sr-bar">
      <label>Rule number <input type="number" class="sr-rule" min="0" max="255" value="30"></label>
      <span class="sr-presets">Try:
        <button type="button" data-rule="30">30</button>
        <button type="button" data-rule="90">90</button>
        <button type="button" data-rule="110">110</button>
        <button type="button" data-rule="4">4</button>
        <button type="button" data-rule="184">184</button>
        <button type="button" data-rule="150">150</button>
      </span>
    </div>
    <div class="sr-card" aria-label="Rule card. Click an answer square to change it."></div>
    <div class="sr-bar">
      <label><input type="radio" name="sr-start" value="one" checked> Start: one black cell</label>
      <label><input type="radio" name="sr-start" value="random"> Start: random</label>
      <button type="button" class="sr-btn sr-draw">▶ Draw it</button>
    </div>
    <canvas class="sr-canvas" width="801" height="400"></canvas>
  </div>

  <div class="sr-pane" data-pane="life" hidden>
    <p class="sr-life-rules">
      <b>The rules.</b> Every cell looks at its 8 neighbors.
      ⬛ A black cell with <b>2 or 3</b> black neighbors stays black. Otherwise it dies (turns white).
      ⬜ A white cell with <b>exactly 3</b> black neighbors is born (turns black).
    </p>
    <div class="sr-bar">
      <button type="button" class="sr-btn sr-run">▶ Run</button>
      <button type="button" class="sr-btn sr-plain sr-step">Step</button>
      <button type="button" class="sr-btn sr-plain sr-clear">Clear</button>
      <span class="sr-presets">Add:
        <button type="button" data-shape="glider">glider</button>
        <button type="button" data-shape="blinker">blinker</button>
        <button type="button" data-shape="rpent">R-pentomino</button>
        <button type="button" data-shape="random">random</button>
      </span>
      <span class="sr-gen">Step 0</span>
    </div>
    <canvas class="sr-life" width="800" height="440"></canvas>
    <p class="sr-hint">Click a square to make it black or white.</p>
  </div>
</div>

<style>
.sr { border: 1px solid #d9e1e8; border-radius: 10px; padding: 0.8rem; margin: 0.75rem 0 1.25rem; background: #fbfcfd; }
.sr-tabs { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.6rem; }
.sr-tab { border: 1px solid #b8c4cf; background: #fff; border-radius: 999px; padding: 0.25rem 0.85rem; font-weight: 600; cursor: pointer; }
.sr-tab[aria-pressed="true"] { background: #2c3e50; color: #fff; border-color: #2c3e50; }
.sr-bar { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; margin: 0.4rem 0; }
.sr-rule { width: 4.5em; font-size: 1rem; padding: 0.15rem 0.3rem; }
.sr-presets button { border: 1px solid #b8c4cf; background: #fff; border-radius: 6px; padding: 0.1rem 0.5rem; cursor: pointer; margin-left: 0.15rem; }
.sr-btn { border: 1px solid #2c3e50; background: #2c3e50; color: #fff; border-radius: 6px; padding: 0.3rem 0.8rem; font-weight: 600; cursor: pointer; }
.sr-btn.sr-plain { background: #fff; color: #2c3e50; }
.sr-card { display: flex; flex-wrap: wrap; gap: 0.6rem; margin: 0.5rem 0; }
.sr-pat { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; }
.sr-three { display: flex; }
.sr-three span, .sr-out { width: 18px; height: 18px; border: 1px solid #2c3e50; display: inline-block; }
.sr-three span.on { background: #2c3e50; }
.sr-out { cursor: pointer; border-width: 2px; }
.sr-out.on { background: #2c3e50; }
.sr-arrow { font-size: 0.8rem; line-height: 1; color: #555; }
.sr-canvas, .sr-life { width: 100%; height: auto; border: 1px solid #e3e8ed; background: #fff; image-rendering: pixelated; display: block; }
.sr-life { cursor: pointer; }
.sr-life-rules { margin: 0 0 0.4rem; line-height: 1.5; }
.sr-gen { font-weight: 600; color: #555; }
.sr-hint { font-size: 0.85rem; color: #555; margin: 0.3rem 0 0; }
</style>

<script>
(() => {
  const root = document.getElementById("sr");
  if (!root) return;

  // ---------- tabs ----------
  root.querySelectorAll(".sr-tab").forEach((t) => t.addEventListener("click", () => {
    root.querySelectorAll(".sr-tab").forEach((x) => x.setAttribute("aria-pressed", x === t));
    root.querySelectorAll(".sr-pane").forEach((p) => (p.hidden = p.dataset.pane !== t.dataset.tab));
    if (t.dataset.tab !== "life") stop();
  }));

  // ---------- one row: elementary cellular automaton ----------
  const ruleIn = root.querySelector(".sr-rule");
  const card = root.querySelector(".sr-card");
  const cv = root.querySelector(".sr-canvas");
  const cx = cv.getContext("2d");
  const W = 161, H = 80, CELL = 5;
  cv.width = W * CELL; cv.height = H * CELL;
  const PATS = [7, 6, 5, 4, 3, 2, 1, 0];
  let rule = 30;

  function drawCard() {
    card.innerHTML = "";
    PATS.forEach((p) => {
      const d = document.createElement("div"); d.className = "sr-pat";
      const three = document.createElement("div"); three.className = "sr-three";
      [4, 2, 1].forEach((bit) => { const s = document.createElement("span"); if (p & bit) s.className = "on"; three.appendChild(s); });
      const arrow = document.createElement("div"); arrow.className = "sr-arrow"; arrow.textContent = "↓";
      const out = document.createElement("button"); out.type = "button";
      out.className = "sr-out" + ((rule >> p) & 1 ? " on" : "");
      out.setAttribute("aria-label", "answer for pattern " + p.toString(2).padStart(3, "0"));
      out.addEventListener("click", () => { rule ^= 1 << p; ruleIn.value = rule; drawCard(); drawRows(); });
      d.append(three, arrow, out); card.appendChild(d);
    });
  }
  function drawRows() {
    const random = root.querySelector('input[name="sr-start"]:checked').value === "random";
    let row = new Array(W).fill(0);
    if (random) row = row.map(() => (Math.random() < 0.5 ? 1 : 0)); else row[Math.floor(W / 2)] = 1;
    cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height);
    cx.fillStyle = "#2c3e50";
    for (let y = 0; y < H; y++) {
      row.forEach((v, x) => { if (v) cx.fillRect(x * CELL, y * CELL, CELL, CELL); });
      row = row.map((_, i) => (rule >> (4 * (row[i - 1] || 0) + 2 * row[i] + (row[i + 1] || 0))) & 1);
    }
  }
  ruleIn.addEventListener("change", () => {
    rule = Math.max(0, Math.min(255, parseInt(ruleIn.value, 10) || 0)); ruleIn.value = rule; drawCard(); drawRows();
  });
  root.querySelectorAll("[data-rule]").forEach((b) => b.addEventListener("click", () => {
    rule = +b.dataset.rule; ruleIn.value = rule; drawCard(); drawRows();
  }));
  root.querySelectorAll('input[name="sr-start"]').forEach((r) => r.addEventListener("change", drawRows));
  root.querySelector(".sr-draw").addEventListener("click", drawRows);
  drawCard(); drawRows();

  // ---------- the Game of Life ----------
  const lv = root.querySelector(".sr-life");
  const lx = lv.getContext("2d");
  const CW = 50, CH = 28, LC = 16;
  lv.width = CW * LC; lv.height = CH * LC;
  let g = Array.from({ length: CH }, () => new Array(CW).fill(0));
  let gen = 0, timer = null;
  const genEl = root.querySelector(".sr-gen");
  const runBtn = root.querySelector(".sr-run");

  function drawLife() {
    lx.fillStyle = "#fff"; lx.fillRect(0, 0, lv.width, lv.height);
    lx.strokeStyle = "#e6ebef"; lx.lineWidth = 1;
    for (let x = 0; x <= CW; x++) { lx.beginPath(); lx.moveTo(x * LC + 0.5, 0); lx.lineTo(x * LC + 0.5, lv.height); lx.stroke(); }
    for (let y = 0; y <= CH; y++) { lx.beginPath(); lx.moveTo(0, y * LC + 0.5); lx.lineTo(lv.width, y * LC + 0.5); lx.stroke(); }
    lx.fillStyle = "#2c3e50";
    g.forEach((row, y) => row.forEach((v, x) => { if (v) lx.fillRect(x * LC + 1, y * LC + 1, LC - 1, LC - 1); }));
    genEl.textContent = "Step " + gen;
  }
  function step() {
    const n = g.map((row, y) => row.map((v, x) => {
      let c = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const yy = (y + dy + CH) % CH, xx = (x + dx + CW) % CW;
        c += g[yy][xx];
      }
      return v ? (c === 2 || c === 3 ? 1 : 0) : (c === 3 ? 1 : 0);
    }));
    g = n; gen++; drawLife();
  }
  function stop() { if (timer) { clearInterval(timer); timer = null; runBtn.textContent = "▶ Run"; } }
  runBtn.addEventListener("click", () => {
    if (timer) stop(); else { timer = setInterval(step, 140); runBtn.textContent = "⏸ Stop"; }
  });
  root.querySelector(".sr-step").addEventListener("click", () => { stop(); step(); });
  root.querySelector(".sr-clear").addEventListener("click", () => { stop(); g = g.map((r) => r.map(() => 0)); gen = 0; drawLife(); });
  const SHAPES = {
    glider: [[0, 1], [1, 2], [2, 0], [2, 1], [2, 2]],
    blinker: [[0, 0], [0, 1], [0, 2]],
    rpent: [[0, 1], [0, 2], [1, 0], [1, 1], [2, 1]],
  };
  root.querySelectorAll("[data-shape]").forEach((b) => b.addEventListener("click", () => {
    if (b.dataset.shape === "random") { g = g.map((r) => r.map(() => (Math.random() < 0.25 ? 1 : 0))); gen = 0; drawLife(); return; }
    const ox = 4 + Math.floor(Math.random() * (CW - 12)), oy = 3 + Math.floor(Math.random() * (CH - 9));
    SHAPES[b.dataset.shape].forEach(([y, x]) => (g[oy + y][ox + x] = 1));
    drawLife();
  }));
  lv.addEventListener("click", (e) => {
    const r = lv.getBoundingClientRect();
    const x = Math.floor(((e.clientX - r.left) / r.width) * CW);
    const y = Math.floor(((e.clientY - r.top) / r.height) * CH);
    if (x >= 0 && x < CW && y >= 0 && y < CH) { g[y][x] ^= 1; drawLife(); }
  });
  drawLife();
})();
</script>
