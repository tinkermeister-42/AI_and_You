<!-- flock.html: Lesson 2.1. A flock of birds (Craig Reynolds' "boids", 1986).
     Each bird looks only at the birds inside its circle and follows 3 simple
     rules. Turn a rule off and watch the flock fall apart. Nobody leads. -->
<div class="fk" id="fk">
  <div class="fk-bar">
    <button type="button" class="fk-btn fk-run">⏸ Pause</button>
    <button type="button" class="fk-btn fk-plain fk-scatter">🔀 Scatter the birds</button>
    <label><input type="checkbox" class="fk-watch"> Watch one bird</label>
  </div>
  <div class="fk-rules">
    <b>Each bird's 3 rules:</b>
    <label><input type="checkbox" class="fk-r" data-r="sep" checked> 1. Don't crash: move away from birds that are too close.</label>
    <label><input type="checkbox" class="fk-r" data-r="ali" checked> 2. Fly the same way as the birds near you.</label>
    <label><input type="checkbox" class="fk-r" data-r="coh" checked> 3. Stay close: steer toward the birds near you.</label>
  </div>
  <canvas class="fk-canvas" width="720" height="380" aria-label="About 70 birds flying. They form flocks."></canvas>
  <div class="fk-msg" aria-live="polite">Each bird only looks at the birds near it. Nobody is the leader.</div>
</div>

<style>
.fk { border: 1px solid #d9e1e8; border-radius: 10px; padding: 0.8rem; margin: 0.75rem 0 1.25rem; background: #fbfcfd; }
.fk-bar { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; margin-bottom: 0.4rem; }
.fk-btn { border: 1px solid #2c3e50; background: #2c3e50; color: #fff; border-radius: 6px; padding: 0.3rem 0.8rem; font-weight: 600; cursor: pointer; }
.fk-btn.fk-plain { background: #fff; color: #2c3e50; }
.fk-rules { display: flex; flex-direction: column; gap: 0.15rem; margin-bottom: 0.5rem; line-height: 1.4; }
.fk-canvas { display: block; width: 100%; height: auto; background: #eaf2fa; border: 1px solid #b8c4cf; border-radius: 8px; }
.fk-msg { margin-top: 0.4rem; font-weight: 600; min-height: 3em; line-height: 1.5; }
</style>

<script>
(() => {
  const root = document.getElementById("fk");
  if (!root) return;
  const cv = root.querySelector(".fk-canvas"), cx = cv.getContext("2d");
  const W = cv.width, H = cv.height, N = 70, SEE = 55, NEAR = 18, MAX = 2.6, MIN = 1.3;
  const on = { sep: true, ali: true, coh: true };
  let birds = [], running = true, watch = false;
  const msg = root.querySelector(".fk-msg");
  function scatter() {
    birds = Array.from({ length: N }, () => { const a = Math.random() * 2 * Math.PI; return { x: Math.random() * W, y: Math.random() * H, vx: 2 * Math.cos(a), vy: 2 * Math.sin(a) }; });
  }
  // the shortest way from b to a, with the edges wrapping around
  const dx = (a, b) => { let d = a - b; if (d > W / 2) d -= W; if (d < -W / 2) d += W; return d; };
  const dy = (a, b) => { let d = a - b; if (d > H / 2) d -= H; if (d < -H / 2) d += H; return d; };
  function step() {
    const next = birds.map((b) => {
      let cx0 = 0, cy0 = 0, vx = 0, vy = 0, sx = 0, sy = 0, n = 0;
      for (const o of birds) {
        if (o === b) continue;
        const ddx = dx(o.x, b.x), ddy = dy(o.y, b.y), d = Math.hypot(ddx, ddy);
        if (d < SEE) { cx0 += ddx; cy0 += ddy; vx += o.vx; vy += o.vy; n++; }
        if (d < NEAR && d > 0) { sx -= ddx / d; sy -= ddy / d; }
      }
      let ax = 0, ay = 0;
      if (n) {
        if (on.coh) { ax += (cx0 / n) * 0.004; ay += (cy0 / n) * 0.004; }
        if (on.ali) { ax += (vx / n - b.vx) * 0.05; ay += (vy / n - b.vy) * 0.05; }
      }
      if (on.sep) { ax += sx * 0.12; ay += sy * 0.12; }
      let nvx = b.vx + ax, nvy = b.vy + ay;
      const sp = Math.hypot(nvx, nvy) || 1;
      const k = sp > MAX ? MAX / sp : sp < MIN ? MIN / sp : 1;
      nvx *= k; nvy *= k;
      return { x: (b.x + nvx + W) % W, y: (b.y + nvy + H) % H, vx: nvx, vy: nvy };
    });
    birds = next;
  }
  function draw() {
    cx.clearRect(0, 0, W, H);
    birds.forEach((b, i) => {
      const a = Math.atan2(b.vy, b.vx), me = watch && i === 0;
      if (me) { cx.strokeStyle = "rgba(211,84,0,0.6)"; cx.lineWidth = 1.5; cx.beginPath(); cx.arc(b.x, b.y, SEE, 0, 2 * Math.PI); cx.stroke(); }
      cx.save(); cx.translate(b.x, b.y); cx.rotate(a);
      cx.fillStyle = me ? "#d35400" : "#2c3e50";
      const s = me ? 1.6 : 1;
      cx.beginPath(); cx.moveTo(8 * s, 0); cx.lineTo(-5 * s, 4 * s); cx.lineTo(-2 * s, 0); cx.lineTo(-5 * s, -4 * s); cx.closePath(); cx.fill();
      cx.restore();
    });
  }
  function tick() { if (running) { step(); draw(); } requestAnimationFrame(tick); }
  const say = () => {
    const off = Object.keys(on).filter((k) => !on[k]);
    msg.textContent = !off.length ? "Each bird only looks at the birds near it. Nobody is the leader. Watch the flocks form."
      : off.length === 3 ? "No rules: every bird flies alone, in a straight line."
      : !on.ali ? "Without \"fly the same way\", birds stay in a crowd, but each one points its own way. It looks more like a swarm of bees than a flock."
      : !on.coh ? "Without \"stay close\", small groups fly together, but the big flocks don't form."
      : "Without \"don't crash\", the birds pile on top of each other.";
  };
  root.querySelectorAll(".fk-r").forEach((c) => c.addEventListener("change", () => { on[c.dataset.r] = c.checked; say(); }));
  root.querySelector(".fk-run").addEventListener("click", (e) => { running = !running; e.target.textContent = running ? "⏸ Pause" : "▶ Fly"; });
  root.querySelector(".fk-scatter").addEventListener("click", () => { scatter(); draw(); });
  root.querySelector(".fk-watch").addEventListener("change", (e) => { watch = e.target.checked; draw(); });
  // don't burn a Chromebook's battery while the flock is off screen
  let autoPaused = false;
  if ("IntersectionObserver" in window) new IntersectionObserver((es) => es.forEach((en) => {
    if (!en.isIntersecting && running) { running = false; autoPaused = true; }
    else if (en.isIntersecting && autoPaused) { running = true; autoPaused = false; }
  })).observe(cv);
  scatter(); draw(); say(); requestAnimationFrame(tick);
})();
</script>
