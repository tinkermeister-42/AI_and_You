```{=html}
<!-- ai_or_not.html: Lesson 1.1 warm up. Tap a choice on each card, then reveal. -->
<div class="aion" id="aion">
  <div class="aion-grid"></div>
  <div class="aion-bar">
    <button type="button" class="aion-reveal">👀 Show Mr. Ross's answers</button>
    <button type="button" class="aion-reset">↺ Start over</button>
  </div>
</div>

<style>
.aion { margin: 0.75rem 0 1.25rem; }
.aion-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 0.6rem;
}
.aion-card {
  border: 1px solid #d9e1e8;
  border-radius: 10px;
  background: #fff;
  padding: 0.6rem 0.6rem 0.55rem;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}
.aion-emoji { font-size: 2.1rem; line-height: 1.1; }
.aion-name { font-weight: 600; line-height: 1.25; min-height: 2.5em; display: flex; align-items: center; justify-content: center; }
.aion-choices { display: flex; gap: 0.25rem; justify-content: center; flex-wrap: wrap; }
.aion-choices button {
  border: 1px solid #b8c4cf;
  background: #f6f8fa;
  border-radius: 999px;
  padding: 0.15rem 0.55rem;
  font-size: 0.85rem;
  cursor: pointer;
}
.aion-choices button[aria-pressed="true"] { color: #fff; border-color: transparent; }
.aion-choices button[data-v="ai"][aria-pressed="true"]     { background: #d35400; }
.aion-choices button[data-v="not"][aria-pressed="true"]    { background: #2c6fae; }
.aion-choices button[data-v="unsure"][aria-pressed="true"] { background: #7f8c8d; }
.aion-answer {
  display: none;
  font-size: 0.85rem;
  line-height: 1.3;
  text-align: left;
  border-top: 1px dashed #d0d7de;
  padding-top: 0.35rem;
}
.aion.revealed .aion-answer { display: block; }
.aion-tag {
  display: inline-block;
  font-weight: bold;
  border-radius: 4px;
  padding: 0 0.35rem;
  margin-right: 0.25rem;
  color: #fff;
}
.aion-tag.ai     { background: #d35400; }
.aion-tag.not    { background: #2c6fae; }
.aion-tag.depends{ background: #7f8c8d; }
.aion-bar { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.7rem; }
.aion-bar button {
  border: 1px solid #2c3e50;
  background: #2c3e50;
  color: #fff;
  border-radius: 6px;
  padding: 0.35rem 0.8rem;
  font-weight: 600;
  cursor: pointer;
}
.aion-bar .aion-reset { background: #fff; color: #2c3e50; }
</style>

<script>
(() => {
  const root = document.getElementById("aion");
  if (!root) return;

  // a = the answer: "ai", "not", or "depends"
  const ITEMS = [
    { e: "🔢", n: "Calculator", a: "not",
      why: "A person wrote exact rules. The same buttons always give the same answer." },
    { e: "🌐", n: "Translation app", a: "ai",
      why: "It learned from millions of sentences in two languages." },
    { e: "⏰", n: "Alarm clock", a: "not",
      why: "It follows one rule: ring at the time you set." },
    { e: "🔓", n: "Face unlock on a phone", a: "ai",
      why: "It learned what your face looks like from examples." },
    { e: "📺", n: "\"Videos for you\" on YouTube or TikTok", a: "ai",
      why: "It predicts the next video you will watch. It learned from what millions of people watched." },
    { e: "✏️", n: "Spell check", a: "depends",
      why: "Old spell check uses a list of words (not AI). New phone keyboards use AI to guess the word you meant." },
    { e: "💬", n: "Chatbot (like ChatGPT or Gemini)", a: "ai",
      why: "It learned from a huge amount of text. It writes by predicting one word after another." },
    { e: "🗺️", n: "Maps app: \"Arrive in 12 min\"", a: "ai",
      why: "It predicts traffic. It learned from millions of trips." },
    { e: "🎮", n: "Enemy in a video game", a: "depends",
      why: "Games call it \"AI\", but most game enemies follow rules a person wrote." },
    { e: "🚗", n: "Self-driving car", a: "ai",
      why: "It learned to see roads, cars, and people from millions of examples." }
  ];
  const TAG = { ai: "AI", not: "Not AI", depends: "It depends" };
  const CHOICES = [["ai", "AI"], ["not", "Not AI"], ["unsure", "Not sure"]];

  const grid = root.querySelector(".aion-grid");
  ITEMS.forEach((it) => {
    const card = document.createElement("div");
    card.className = "aion-card";
    card.innerHTML =
      `<div class="aion-emoji" aria-hidden="true">${it.e}</div>` +
      `<div class="aion-name">${it.n}</div>` +
      `<div class="aion-choices">` +
      CHOICES.map(([v, label]) => `<button type="button" data-v="${v}" aria-pressed="false">${label}</button>`).join("") +
      `</div>` +
      `<div class="aion-answer"><span class="aion-tag ${it.a}">${TAG[it.a]}</span>${it.why}</div>`;
    card.querySelectorAll(".aion-choices button").forEach((b) => {
      b.addEventListener("click", () => {
        const on = b.getAttribute("aria-pressed") !== "true";
        card.querySelectorAll(".aion-choices button").forEach((x) => x.setAttribute("aria-pressed", "false"));
        b.setAttribute("aria-pressed", on ? "true" : "false");
      });
    });
    grid.appendChild(card);
  });

  const reveal = root.querySelector(".aion-reveal");
  reveal.addEventListener("click", () => {
    const shown = root.classList.toggle("revealed");
    reveal.textContent = shown ? "🙈 Hide the answers" : "👀 Show Mr. Ross's answers";
  });
  root.querySelector(".aion-reset").addEventListener("click", () => {
    root.classList.remove("revealed");
    reveal.textContent = "👀 Show Mr. Ross's answers";
    root.querySelectorAll(".aion-choices button").forEach((x) => x.setAttribute("aria-pressed", "false"));
  });
})();
</script>
```
